# model/ids.toml --- the conformance ID register.
#
# Every ID this repository claims, in one place, so that nothing is referenced
# without being defined. `CONFORMANCE.md` is generated from this file. A test
# whose name ends in an ID not listed here fails `check-model`, and an ID listed
# here with no scenario and no test fails it too (CM-02).
#
# `level` is the honesty level (R2):
#   some-true  a fact reproduced from an authority; not established here
#   build      constructed here and validated against its oracle
#   open       measured and reported, never asserted
#
# Every row here has a scenario in `features/suites/` and a test whose name ends
# in the ID, lowercased with underscores (R3, CM-02). There is no "pending"
# state: a capability that is not built does not get a row, and every row in this
# file is built.
#
# The rows below are the hub kernel in `app/` (HK-01 to HK-10): each names one
# theorem Lean proves in `app/src/Proofs/`.
# A capability starts with a row here; `just new-capability` writes the row,
# its scenario and its failing test in the order `AGENTS.md` sets out.

spec = "template/1"

[[id]]
id = "HK-01"
level = "build"
suite = "kernel"
statement = "A missing repository and a private repository get the same answer: repository not found, with no source and no ETag"

[[id]]
id = "HK-02"
level = "build"
suite = "kernel"
statement = "The kernel delivers a file only for a public repository at a resolved revision whose entry exists, and names a source and an ETag exactly when it delivers"

[[id]]
id = "HK-03"
level = "build"
suite = "kernel"
statement = "The edge runner only ever redirects and the local runner only ever serves"

[[id]]
id = "HK-04"
level = "build"
suite = "kernel"
statement = "The edge runner never redirects to a source that is not vetted"

[[id]]
id = "HK-05"
level = "build"
suite = "kernel"
statement = "A delivered file always has a source, and the kernel never chooses a source that does not hold the file or that failed verification for it"

[[id]]
id = "HK-06"
level = "build"
suite = "kernel"
statement = "A pinned source is the only source the kernel may choose"

[[id]]
id = "HK-07"
level = "build"
suite = "kernel"
statement = "Without a pin, the kernel chooses a healthy source whenever a usable one exists"

[[id]]
id = "HK-08"
level = "build"
suite = "kernel"
statement = "A delivered small file carries the git blob ETag and a delivered large file carries the SHA-256 ETag"

[[id]]
id = "HK-09"
level = "build"
suite = "kernel"
statement = "A commit prefix resolves only when it is 7 to 40 characters long and matches the release's commit"

[[id]]
id = "HK-10"
level = "build"
suite = "kernel"
statement = "Received bytes are delivered exactly when their digest and size equal the expected digest and size"

[[id]]
id = "HK-11"
level = "build"
suite = "kernel"
statement = "Every header item and every link that stays in the hub opens a screen the kernel renders"

[[id]]
id = "HK-12"
level = "build"
suite = "kernel"
statement = "A Hugging Face tool sees no HTTP error exactly when the kernel delivers, and every refusal reaches it as a 4xx or 5xx status with a named error code"

[[id]]
id = "HK-13"
level = "build"
suite = "kernel"
statement = "The page says Verified only when at least one source delivered and none sent other bytes, and any source that sent other bytes makes the verdict a mismatch"

[[id]]
id = "HK-14"
level = "build"
suite = "kernel"
statement = "A model page says Witnessed or Published only when every signature check passed, says Published only for a publisher's signature from the namespace owner, and never shows a witness's signature as a publisher's"

[[id]]
id = "HK-15"
level = "build"
suite = "kernel"
statement = "An answer is built from the index only when the record holds every field that answer names; where one is missing the source dialect is asked, and where it cannot be asked the answer says it is partial"

[[id]]
id = "HK-16"
level = "build"
suite = "kernel"
statement = "Every filter the browse page offers maps to one query parameter and back, so a link carries the whole state"

[[id]]
id = "HK-17"
level = "build"
suite = "kernel"
statement = "An address with two witnesses is used only when they agree; where one witness alone names it the page says so, and where they disagree the file has no address"

[[id]]
id = "HK-18"
level = "build"
suite = "index"
statement = "A release record always carries the fields a client reads: the repository, the revision, every file with its path, size and git blob address, and the sources that hold it"

[[id]]
id = "HK-19"
level = "build"
suite = "kernel"
statement = "A source that is not vetted is chosen only for a file whose address the record names, so bytes from an untrusted source are always checkable before they are served"

[[id]]
id = "HK-20"
level = "build"
suite = "index"
statement = "A release record names where its own bytes come from, and the edge sends a client to that same place, so a reader who is not the edge can fetch and check a file without knowing which hub built the record"

[[id]]
id = "HK-21"
level = "build"
suite = "index"
statement = "A swarm catalog row is filed under the shard key the page resolves a query with, and says it is a listing rather than a checked record, so a search reads one shard and what it draws is not mistaken for proof"

[[id]]
id = "HK-22"
level = "build"
suite = "kernel"
statement = "A source nobody vetted is chosen only for a file the release itself addressed, so the party serving the bytes is never the only party that named them; what the ETag says and what the sources may serve are decided by different facts"
