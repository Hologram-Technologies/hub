# model/ids.toml --- the conformance ID register.
#
# Every ID this repository claims, in one place, so that nothing is referenced
# without being defined. `CONFORMANCE.md` is generated from this file. A test
# whose name ends in an ID not listed here fails `check-model`, and an ID listed
# here with no scenario and no test fails it too (CM-02).
#
# `level` is the honesty level (R2):
#   some-true  a fact reproduced from an authority; not established here
#   build      constructed here and validated against its oracle
#   open       measured and reported, never asserted
#
# Every row here has a scenario in `features/suites/` and a test whose name ends
# in the ID, lowercased with underscores (R3, CM-02). There is no "pending"
# state: a capability that is not built does not get a row, and every row in this
# file is built.
#
# The rows below are the hub kernel in `app/` (HK-01 to HK-10): each names one
# theorem Lean proves in `app/src/Proofs/`.
# A capability starts with a row here; `just new-capability` writes the row,
# its scenario and its failing test in the order `AGENTS.md` sets out.

spec = "template/1"

[[id]]
id = "HK-01"
level = "build"
suite = "kernel"
statement = "A missing repository and a private repository get the same answer: repository not found, with no source and no ETag"

[[id]]
id = "HK-02"
level = "build"
suite = "kernel"
statement = "The kernel delivers a file only for a public repository at a resolved revision whose entry exists, and names a source and an ETag exactly when it delivers"

[[id]]
id = "HK-03"
level = "build"
suite = "kernel"
statement = "The edge runner only ever redirects and the local runner only ever serves"

[[id]]
id = "HK-04"
level = "build"
suite = "kernel"
statement = "The edge runner never redirects to a source that is not vetted"

[[id]]
id = "HK-05"
level = "build"
suite = "kernel"
statement = "A delivered file always has a source, and the kernel never chooses a source that does not hold the file or that failed verification for it"

[[id]]
id = "HK-06"
level = "build"
suite = "kernel"
statement = "A pinned source is the only source the kernel may choose"

[[id]]
id = "HK-07"
level = "build"
suite = "kernel"
statement = "Without a pin, the kernel chooses a healthy source whenever a usable one exists"

[[id]]
id = "HK-08"
level = "build"
suite = "kernel"
statement = "A delivered small file carries the git blob ETag and a delivered large file carries the SHA-256 ETag"

[[id]]
id = "HK-09"
level = "build"
suite = "kernel"
statement = "A commit prefix resolves only when it is 7 to 40 characters long and matches the release's commit"

[[id]]
id = "HK-10"
level = "build"
suite = "kernel"
statement = "Received bytes are delivered exactly when their digest and size equal the expected digest and size"

[[id]]
id = "HK-11"
level = "build"
suite = "kernel"
statement = "Every header item and every link that stays in the hub opens a screen the kernel renders"

[[id]]
id = "HK-12"
level = "build"
suite = "kernel"
statement = "A Hugging Face tool sees no HTTP error exactly when the kernel delivers, and every refusal reaches it as a 4xx or 5xx status with a named error code, except the refusal of a client with no token, which carries exactly the headers Hugging Face sends it"

[[id]]
id = "HK-13"
level = "build"
suite = "kernel"
statement = "The page says Verified only when at least one source delivered and none sent other bytes, and any source that sent other bytes makes the verdict a mismatch"

[[id]]
id = "HK-14"
level = "build"
suite = "kernel"
statement = "A model page says Witnessed or Published only when every signature check passed, says Published only for a publisher's signature from the namespace owner, and never shows a witness's signature as a publisher's"

[[id]]
id = "HK-15"
level = "build"
suite = "kernel"
statement = "An answer is built from the index only when the record holds every field that answer names; where one is missing the source dialect is asked, and where it cannot be asked the answer says it is partial"

[[id]]
id = "HK-16"
level = "build"
suite = "kernel"
statement = "Every filter the browse page offers maps to one query parameter and back, so a link carries the whole state"

[[id]]
id = "HK-17"
level = "build"
suite = "kernel"
statement = "An address with two witnesses is used only when they agree; where one witness alone names it the page says so, and where they disagree the file has no address"

[[id]]
id = "HK-18"
level = "build"
suite = "index"
statement = "A release record always carries the fields a client reads: the repository, the revision, every file with its path, size and git blob address, and the sources that hold it"

[[id]]
id = "HK-19"
level = "build"
suite = "kernel"
statement = "A source that is not vetted is chosen only for a file whose address the record names, so bytes from an untrusted source are always checkable before they are served"

[[id]]
id = "HK-20"
level = "build"
suite = "index"
statement = "A release record names where its own bytes come from, and the edge sends a client to that same place, so a reader who is not the edge can fetch and check a file without knowing which hub built the record"

[[id]]
id = "HK-21"
level = "build"
suite = "index"
statement = "A swarm catalog row is filed under the shard key the page resolves a query with, and says it is a listing rather than a checked record, so a search reads one shard and what it draws is not mistaken for proof"

[[id]]
id = "HK-22"
level = "build"
suite = "kernel"
statement = "A source nobody vetted is chosen only for a file the release itself addressed, so the party serving the bytes is never the only party that named them; what the ETag says and what the sources may serve are decided by different facts"

[[id]]
id = "HK-23"
level = "build"
suite = "index"
statement = "A suggestion the header offers is filed under the words the page resolves a query with, and a panel the head of the catalogue could not fill says so and is completed from the full index, so a short list is never mistaken for the whole answer"

[[id]]
id = "HK-24"
level = "build"
suite = "index"
statement = "Every row in the UOR address index carries a canonical address and the canonical-form version that minted it, taken here from bytes this build streamed rather than copied from any host, and is filed under the shard key the page resolves a model with"

[[id]]
id = "HK-25"
level = "build"
suite = "index"
statement = "The page shows a tensor address as checked only when the kernel accepted bytes the page fetched itself, so an address the hub published is never drawn as proof of bytes nobody read"

[[id]]
id = "HK-26"
level = "build"
suite = "index"
statement = "A filter the panel offers is one whatever is driving the list can act on, so a control is never drawn that cannot narrow anything"

[[id]]
id = "HK-27"
level = "build"
suite = "spaces"
statement = "Every Space the site publishes is the sealed artifact its catalog names: each file hashes to its lock entry, the manifest hashes to the root, and the runtime comes from locked packages whose bytes match the lock too"

[[id]]
id = "HK-28"
level = "build"
suite = "buckets"
statement = "The object store holds each object only under the SHA-256 of its bytes, every file a published Space is made of is in it, and the address the Buckets page offers as its example is one the store holds"

[[id]]
id = "HK-29"
level = "build"
suite = "index"
statement = "The index learns which other sources hold a release only from the holders record this repository carries, and only for the revision that record names, so a build reads no other hub"

[[id]]
id = "HK-30"
level = "build"
suite = "apex"
statement = "Every command the model page gives a tool is one whose requests the apex routes to this repository, so the site never offers a command that reaches nothing"

[[id]]
id = "HK-33"
level = "build"
suite = "apex"
statement = "A tool that asks the apex for its bare name, curl gethologram.ai over http or https, gets a plain-text guide published as a static file and written from the home screen's model, every curl in it reaches a route the apex answers, and the home page prints that command"

[[id]]
id = "HK-34"
level = "build"
suite = "apex"
statement = "The landing hero fits every screen from 320 pixels wide: no part of it is wider than the window, so nothing is cut off and the page never scrolls sideways"

[[id]]
id = "HK-31"
level = "build"
suite = "surface"
statement = "Every read operation Hugging Face answers a client with no token, for models, datasets and Spaces, is one the hub answers at Hugging Face's own path and in its terms, and none of them is refused"

[[id]]
id = "HK-32"
level = "build"
suite = "surface"
statement = "Every request the hub does not answer as a read is refused as Hugging Face refuses a client with no token: 401 with a Bearer challenge"

[[id]]
id = "HK-35"
level = "build"
suite = "index"
statement = "Every safetensors file in the UOR address index is addressed by uor-addr's safetensors realization, and each of its tensors carries the BLAKE3 leaf the file's label binds, which is its address, and the byte range that leaf was taken over, so a reader checks one tensor from a ranged read"

[[id]]
id = "HK-36"
level = "build"
suite = "runner"
statement = "The runner checks a file it serves from its cache against the file's address and every tensor's address on every read, as it checks a fresh fetch, and a cached file that fails is deleted and fetched again rather than served"

[[id]]
id = "HK-37"
level = "build"
suite = "runner"
statement = "When every source sends bytes that do not match the address, the runner refuses with Quarantined, naming the address it expected and the one it got, so a client can tell bad bytes from an outage"

[[id]]
id = "HK-38"
level = "build"
suite = "verify"
statement = "A downloaded model file is checked against the UOR address index by a verifier that uses only the Python standard library: it recomputes the file's canonical label and every tensor's leaf, and refuses the file naming each tensor that does not match"

[[id]]
id = "HK-39"
level = "build"
suite = "kernel"
statement = "A piece of a file is delivered only when its piece table folds to the requested address and the piece matches the table entry in chaining value and length"

[[id]]
id = "HK-40"
level = "build"
suite = "kernel"
statement = "A piece the local store holds is reused only when its piece table folds to the requested address and the stored piece matches the table entry"

[[id]]
id = "HK-41"
level = "build"
suite = "kernel"
statement = "A stored piece that matches a piece table of the requested address is always reused and never fetched again"

[[id]]
id = "HK-42"
level = "build"
suite = "kernel"
statement = "A piece is refused only when no source is left, and retried only while a source remains"

[[id]]
id = "HK-43"
level = "build"
suite = "pieces"
statement = "A model's bytes are fetched in pieces from any host, and a piece is used only when the fetcher's decision, the kernel's piece rule, answers reuse or deliver; that decision keeps HK-39 to HK-42 on every input, and the committed hasher is what its source builds"

[[id]]
id = "HK-44"
level = "build"
suite = "index"
statement = "Every tensor longer than 1 MiB in the UOR address index has a piece table, published under the tensor's address, that folds to that address, so a reader checks each piece of the tensor as it arrives"

[[id]]
id = "HK-45"
level = "build"
suite = "kernel"
statement = "A file is served only when its bytes match its BLAKE3 address, or, for a file never addressed before, the name Hugging Face gives it (the LFS SHA-256, or a small file's git blob), at the size and with every tensor matching"

[[id]]
id = "HK-46"
level = "build"
suite = "kernel"
statement = "Once a file has a BLAKE3 address, bytes that do not match it are refused whatever Hugging Face's own name for the file says"

[[id]]
id = "HK-47"
level = "build"
suite = "kernel"
statement = "A BLAKE3 address is minted only for a file that has none, never over an existing one"

[[id]]
id = "HK-48"
level = "build"
suite = "kernel"
statement = "A file with an address is served only on the BLAKE3 axis"

[[id]]
id = "HK-49"
level = "build"
suite = "kernel"
statement = "A file is served or minted only when every tensor it declares matches its address"
