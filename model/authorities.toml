# model/authorities.toml --- what this repository cites rather than proves.
#
# A `some-true` claim is reproduced from an authority and is not established
# here. This file is where the authority is named well enough for a third party
# to find it, with a checksum over the committed artifact when there is one and
# a stated reason when there is not.
#
# `realized_by` lists the conformance IDs that are *evidence* this repository
# realizes the cited fact. Evidence is not proof, and the meta-gate fails the
# build if any document blurs the two registers.
#
spec = "template/1"

[[authority]]
id = "UOR-ADDR-0-2-0"
name = "UOR-ADDR, the gguf realization, canonical form 2"
citation = "https://crates.io/crates/uor-addr/0.2.0"
checksum = "none"
checksum_reason = "The crate is a pinned registry dependency, not an artifact committed here: `Cargo.lock` records its digest and `cargo deny` refuses an unknown registry, so the bytes are held to by the lock rather than by a second copy of the hash."
statement = "A canonical form for GGUF v3, hashed to a 71-byte kappa-label `sha256:<64hex>`, in which every variable-length leaf is represented by the streamed SHA-256 of its own bytes, and under which two files that decode to the same logical content -- modulo metadata-key order, tensor order and tensor-data layout -- canonicalize to byte-identical skeletons and so to the same label."
realized_by = ["HK-23", "HK-24"]
