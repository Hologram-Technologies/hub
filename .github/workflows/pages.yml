# Publishes the repository's app page: `site/` with the holo that `just app`
# builds and verifies through the locked SDK. Project content, not universal
# policy: a repository may extend or replace it.
#
# It runs on every push to main, beside `bootstrap`, not after it: `just app`
# is the proof-bearing build (the Lean kernel checks every theorem before the
# holo exists), so the page goes live as soon as that passes, while the rest of
# the gate runs on both architectures. The SDK step and the signing step are
# the ones `build.yml` runs, copied here: the gate pins every `uses:` to a
# commit and so forbids calling a workflow by path. When `build.yml` changes
# either step, copy it again. The page then carries the same holo that
# `prism-code build --remote github` would hand a device, with the signed
# provenance of the run that made it beside it.
name: pages

on:
  push:
    branches: [main]
  # The hub tracks Hugging Face, not this repository's commits. Without this
  # the published catalogue only moves when somebody pushes, which has nothing
  # to do with what Hugging Face published overnight.
  #
  # Every six hours, because a run of this workflow takes 19 to 33 minutes
  # (measured over the five runs before 2026-11-14) and `concurrency: pages`
  # does not cancel in progress, so a shorter period would queue runs behind
  # each other rather than refresh anything sooner. Four runs a day against a
  # creation rate of about 138 models an hour means a scheduled build sees
  # roughly 800 new models' worth of movement.
  #
  # GitHub delays scheduled runs under load, sometimes by a long time, so this
  # is a floor on staleness and not a promise. It does not need to be a
  # promise: a model the published index does not yet hold is still answered,
  # because the edge asks Hugging Face for anything it cannot answer itself.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build and verify the holo, sign its provenance, assemble the page
    # The template repository publishes its try page instead (try-page.yml).
    if: github.repository != 'UOR-Foundation/template'
    runs-on: ubuntu-24.04
    # Indexing is normally almost free, because a record is reused whenever the
    # release has not moved. A run that cannot reuse the cache pays two Hugging
    # Face calls per record at the one-a-second pace `hf()` keeps, which is about
    # twenty minutes for the current catalog and grows with it. That is rare, but
    # when it happens the job must finish rather than look like a flake.
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the brand and the frame against brand.lock and frame.lock
        shell: bash
        run: |
          set -euo pipefail
          node bootstrap/brand-sync.mjs --check
          python3 -I bootstrap/brand-fonts.py --check
          node bootstrap/frame-sync.mjs --check
      - name: Build and verify the holo through the locked SDK
        shell: bash
        run: |
          set -euo pipefail
          image=$(sed -n 's/.*"sdk_image":"\([^"]*\)".*/\1/p' prismpm.lock)
          if [[ ! $image =~ ^[a-z0-9.-]+(:[0-9]{1,5})?/[a-z0-9./_-]+@sha256:[0-9a-f]{64}$ ]]; then
            printf '%s\n' 'prismpm.lock does not select an immutable SDK image' >&2
            exit 64
          fi
          docker_config=$(mktemp -d)
          trap 'rm -rf "$docker_config"' EXIT
          printf '{}\n' >"$docker_config/config.json"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --group-add "$(stat -c '%g' /var/run/docker.sock)" \
            --tmpfs /tmp:rw,exec,nosuid,size=2g \
            --volume "$PWD:$PWD" \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$docker_config:/tmp/prismpm-home/.docker:ro" \
            --workdir "$PWD" \
            --env DOCKER_CONFIG=/tmp/prismpm-home/.docker \
            --env BUILDX_CONFIG=/tmp/prismpm-buildx \
            --env HOME=/tmp/prismpm-home \
            --env PRISMPM_EPHEMERAL_HOME=1 \
            "$image" just app
      - name: Find the holo
        id: holo
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          holos=(app/.prism/build/*/*.holo)
          if [[ ${#holos[@]} -ne 1 ]]; then
            printf 'expected one holo, found %d\n' "${#holos[@]}" >&2
            exit 64
          fi
          fingerprint=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).archive_fingerprint)' "$(dirname "${holos[0]}")/application/holo-identities.json")
          {
            echo "path=${holos[0]}"
            echo "fingerprint=$fingerprint"
          } >>"$GITHUB_OUTPUT"
      - name: Sign the holo's provenance as this repository's workflow
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.holo.outputs.path }}
          show-summary: false
      - name: Draw the social image and the icons for this app.json
        # page.mjs refuses an og.png or icon not drawn for this app.json. Drawing
        # them here, with Pillow pinned by hash, means a new app needs neither
        # Python nor Pillow on its author's machine; the committed images only
        # serve a local preview.
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/draw"
          "$RUNNER_TEMP/draw/bin/pip" install --quiet --no-deps --only-binary :all: --require-hashes -r bootstrap/draw-requirements.txt
          "$RUNNER_TEMP/draw/bin/python" -I bootstrap/og.py
          "$RUNNER_TEMP/draw/bin/python" -I bootstrap/icons.py
      - name: Assemble the page
        shell: bash
        env:
          HOLO: ${{ steps.holo.outputs.path }}
          FINGERPRINT: ${{ steps.holo.outputs.fingerprint }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
        run: |
          set -euo pipefail
          cp "$HOLO" site/app.holo
          cp -r try/vendor site/vendor
          rm -rf site/vendor/prism-code/fixtures
          # The page says where this holo's provenance is: the signed statement
          # GitHub keeps for the build that made it.
          node -e '
            const { readFileSync, writeFileSync } = require("node:fs");
            const [id, url] = process.argv.slice(1);
            const app = JSON.parse(readFileSync("site/app.json", "utf8"));
            app.attestations ??= {};
            app.attestations.build = { id, url };
            writeFileSync("site/app.json", `${JSON.stringify(app, null, 2)}\n`);
          ' "$FINGERPRINT" "$ATTESTATION_URL"
          node bootstrap/page.mjs site
          node bootstrap/precache.mjs site
      - name: Lighthouse at 100 on mobile, before anything is deployed
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --global @lhci/cli@0.15.1
          lhci autorun --config=lighthouserc.json
      - name: Every Material 3 window size class, both themes, before anything is deployed
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --global playwright@1.56.1
          playwright install --with-deps chromium
          node bootstrap/screens.mjs site screens
      - name: Keep the screens
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: screens
          path: screens
          if-no-files-found: ignore
      - name: Keep witnessed manifests between runs
        # A manifest is reused while its model's revision is unchanged, so an
        # unchanged release is never downloaded and hashed again.
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/manifests
          key: manifests-${{ hashFiles('manifests/models.txt', 'tools/manifest.mjs') }}-${{ github.run_id }}
          restore-keys: manifests-${{ hashFiles('manifests/models.txt', 'tools/manifest.mjs') }}-
      - name: Witness the listed models
        shell: bash
        run: |
          set -euo pipefail
          node tools/manifest.mjs manifests/models.txt "$RUNNER_TEMP/manifests"
      - name: Sign the manifests as this repository's workflow
        id: witness
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/manifests/**/*.json
          predicate-type: https://hologram.foundation/hub/witness/v1
          predicate: '{"witness":"https://huggingface.co","tool":"tools/manifest.mjs"}'
          show-summary: false
      - name: Keep the index between runs
        # A record is reused while its model's revision is unchanged.
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/index
          key: index-${{ hashFiles('tools/index.mjs', 'manifests/models.txt', 'manifests/owners.txt') }}-${{ github.run_id }}
          restore-keys: index-${{ hashFiles('tools/index.mjs', 'manifests/models.txt', 'manifests/owners.txt') }}-
      - name: Index the catalog's models
        shell: bash
        run: |
          set -euo pipefail
          node tools/index.mjs "$RUNNER_TEMP/index"
      - name: The browse list is only what the signed root names
        shell: bash
        run: node tests/index/shards.mjs "$RUNNER_TEMP/index"
      - name: Sign the index root as this repository's workflow
        id: indexsig
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/index/root.json
          predicate-type: https://hologram.foundation/hub/index/v1
          # Two sources, named apart, because they are not equally first-hand:
          # every fact about a release is Hugging Face's own answer, and which
          # other sources hold its bytes is still the live hub's claim.
          predicate: '{"tool":"tools/index.mjs","releases":"https://huggingface.co","holders":"https://gethologram.ai/data/files"}'
          show-summary: false

      # ---- the roll: every model Hugging Face has ever listed
      # The index addresses a few hundred models and costs two calls each. The
      # roll names every one of them and costs about one call per thousand, so
      # the two are built apart and only the roll is total.
      # `docs/model-roll.md` has the arithmetic.
      - name: Keep the roll between runs
        # Without this a run has nothing to continue from, and the next step
        # refuses rather than walking three million rows inside a 60-minute
        # job. Priming it is `roll-sweep.yml`, run by hand, once.
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/roll
          key: roll-${{ hashFiles('tools/roll.mjs') }}-${{ github.run_id }}
          restore-keys: roll-${{ hashFiles('tools/roll.mjs') }}-
      - name: Catch the roll up with what Hugging Face has listed since
        id: roll
        # `--tail` walks only what is new. Measured 2026-11-14: two calls and a
        # few seconds to pick up a day's 1,007 models. It exits 69 rather than
        # sweeping when there is nothing to continue from, so a cold cache
        # stops this step instead of running for an hour and being killed.
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/roll/root.json" ]; then
            node tools/roll.mjs "$RUNNER_TEMP/roll" --tail
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No roll in the cache, so the site is published without one. Run roll-sweep.yml once to prime it."
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Nothing is published that the roll's root does not name
        if: steps.roll.outputs.built == 'true'
        shell: bash
        run: node tests/roll/published.mjs "$RUNNER_TEMP/roll"
      - name: Build the index the interface pages the roll through
        if: steps.roll.outputs.built == 'true'
        # Without this the roll is published and unusable: the interface reads
        # `data/browse/`, and a deploy that ships the rows without the index
        # leaves the catalogue at whatever the addressed index holds.
        shell: bash
        run: |
          set -euo pipefail
          node tools/browse-index.mjs "$RUNNER_TEMP/roll" "$RUNNER_TEMP/browse"
          node tests/browse/page.mjs "$RUNNER_TEMP/browse"

      - name: Take the swarm address snapshot the nightly run left
        # Written by `.github/workflows/swarm.yml`, not here: a full catalog
        # walk is about 22,300 requests and must not sit in front of a deploy.
        # A deploy that finds none publishes none, and the runner falls back to
        # asking Hugging Face live.
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/swarm
          key: swarm-${{ hashFiles('tools/swarm-index.mjs') }}-
          restore-keys: swarm-${{ hashFiles('tools/swarm-index.mjs') }}-
      - name: Every snapshot shard is the bytes its root names
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/swarm/root.json" ]; then
            node tests/index/swarm-shards.mjs "$RUNNER_TEMP/swarm"
          else
            echo "no swarm snapshot in the cache yet; nothing to publish"
          fi
          # The catalog is published from the same cache, so it is held to the
          # same thing here rather than only where it was built.
          if [ -f "$RUNNER_TEMP/swarm/catalog/root.json" ]; then
            node tests/index/swarm-catalog.mjs "$RUNNER_TEMP/swarm/catalog"
          else
            echo "no swarm catalog in the cache yet; nothing to publish"
          fi
      - name: Sign the snapshot root as this repository's workflow
        id: swarmsig
        if: hashFiles(format('{0}/swarm/root.json', runner.temp)) != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/swarm/root.json
          predicate-type: https://hologram.foundation/hub/swarm/v1
          predicate: '{"addresses":"https://huggingface.co","catalog":"https://pirateface.co","tool":"tools/swarm-index.mjs"}'
          show-summary: false
      - name: Put the hub at the root and the proof page under app/
        env:
          WITNESS_BUNDLE: ${{ steps.witness.outputs.bundle-path }}
          INDEX_BUNDLE: ${{ steps.indexsig.outputs.bundle-path }}
          SWARM_BUNDLE: ${{ steps.swarmsig.outputs.bundle-path }}
        # The hub's interface (web/) is drawn from screens the verified holo
        # serves, so it reads the holo, the runtime, the brand tokens and the
        # fonts from the proof page beside it; nothing is copied twice.
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/pages"
          mkdir -p "$RUNNER_TEMP/pages"
          cp -r web/. "$RUNNER_TEMP/pages/"
          cp -r site "$RUNNER_TEMP/pages/app"
          test -f "$RUNNER_TEMP/pages/app/app.holo"
          test -f "$RUNNER_TEMP/pages/app/vendor/prism-code/src/browser.mjs"
          mkdir -p "$RUNNER_TEMP/pages/data"
          cp -r "$RUNNER_TEMP/manifests" "$RUNNER_TEMP/pages/data/manifests"
          # The index goes in before the two page tools run: both read the
          # models from it, so the pages and the browse list name one set.
          cp -r "$RUNNER_TEMP/index" "$RUNNER_TEMP/pages/data/index"
          # The roll, when there is one. It is the largest thing the site
          # carries by a wide margin, so the deploy says how large.
          if [ -f "$RUNNER_TEMP/roll/root.json" ]; then
            cp -r "$RUNNER_TEMP/roll" "$RUNNER_TEMP/pages/data/roll"
            cp -r "$RUNNER_TEMP/browse" "$RUNNER_TEMP/pages/data/browse"
            echo "roll: $(du -sh "$RUNNER_TEMP/pages/data/roll" | cut -f1), index $(du -sh "$RUNNER_TEMP/pages/data/browse" | cut -f1)"
          fi
          # A published GitHub Pages site may be no larger than 1 GB, and the
          # roll is most of what this one weighs. Refusing here names the
          # problem; letting the deploy do it gives an error about an artifact.
          size=$(du -sm "$RUNNER_TEMP/pages" | cut -f1)
          echo "site: ${size} MB of the 1024 MB a published Pages site may be"
          if [ "$size" -gt 950 ]; then
            echo "::error::The site is ${size} MB. GitHub refuses a published Pages site over 1024 MB, and this is past the 950 MB this build allows itself."
            exit 1
          fi
          node tools/web-routes.mjs "$RUNNER_TEMP/pages"
          node tools/web-data.mjs "$RUNNER_TEMP/pages" https://gethologram.ai
          node -e '
            const { readFileSync, writeFileSync } = require("node:fs");
            const text = readFileSync(process.argv[1], "utf8").trim();
            let bundle;
            try { bundle = JSON.parse(text); } catch { bundle = JSON.parse(text.split("\n")[0]); }
            writeFileSync(process.argv[2], JSON.stringify(bundle));
          ' "$WITNESS_BUNDLE" "$RUNNER_TEMP/pages/data/manifests/witness.sigstore.json"
          node -e '
            const { readFileSync, writeFileSync } = require("node:fs");
            const text = readFileSync(process.argv[1], "utf8").trim();
            let bundle;
            try { bundle = JSON.parse(text); } catch { bundle = JSON.parse(text.split("\n")[0]); }
            writeFileSync(process.argv[2], JSON.stringify(bundle));
          ' "$INDEX_BUNDLE" "$RUNNER_TEMP/pages/data/index/index.sigstore.json"
          if [ -f "$RUNNER_TEMP/swarm/root.json" ]; then
            cp -r "$RUNNER_TEMP/swarm" "$RUNNER_TEMP/pages/data/swarm"
            node -e '
              const { readFileSync, writeFileSync } = require("node:fs");
              const text = readFileSync(process.argv[1], "utf8").trim();
              let bundle;
              try { bundle = JSON.parse(text); } catch { bundle = JSON.parse(text.split("\n")[0]); }
              writeFileSync(process.argv[2], JSON.stringify(bundle));
            ' "$SWARM_BUNDLE" "$RUNNER_TEMP/pages/data/swarm/swarm.sigstore.json"
          fi
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Upload the page
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    name: publish the page
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

  smoke:
    name: open the published pages in a browser
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every page loads the kernel, replays every example and draws its screen
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --global playwright@1.56.1
          playwright install --with-deps chromium
          node tools/smoke.mjs "https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"

  offline:
    name: a Hugging Face client works with Hugging Face switched off
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: The edge answers from the signed index alone, with Hugging Face drained
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/hf"
          "$RUNNER_TEMP/hf/bin/pip" install --quiet huggingface_hub==2.4.0 hf_xet==1.8.0
          HF_API=off DRAIN=huggingface.co node edge/serve.mjs 8787 > "$RUNNER_TEMP/edge.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/health > /dev/null && break; sleep 1; done
          cat "$RUNNER_TEMP/edge.log"
          curl -sf http://127.0.0.1:8787/health | grep -q '"index":[1-9]'
          py="$RUNNER_TEMP/hf/bin/python"
          "$py" tests/edge/observe.py "$RUNNER_TEMP/ref" > "$RUNNER_TEMP/ref.json"
          OFFLINE=1 HF_ENDPOINT=http://127.0.0.1:8787 "$py" tests/edge/observe.py "$RUNNER_TEMP/off" > "$RUNNER_TEMP/off.json"
          "$py" tests/edge/compare.py "$RUNNER_TEMP/ref.json" "$RUNNER_TEMP/off.json"
      - name: The listing answers the whole query from the index alone
        shell: bash
        run: node tests/edge/listing.mjs https://hologram-technologies.github.io/hub/app/app.holo https://hologram-technologies.github.io/hub/data/index/
      - name: An incomplete record is never served as though it were whole
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/index-copy"
          mkdir -p "$RUNNER_TEMP/index-copy/models"
          node --input-type=module -e '
            import { mkdir, writeFile } from "node:fs/promises";
            import { dirname, join } from "node:path";
            const base = "https://hologram-technologies.github.io/hub/data/index/";
            const out = process.argv[1];
            const root = await (await fetch(base + "root.json")).json();
            root.records = root.records.slice(0, 2);
            // The copy carries records, not the listing: the edge checks every
            // shard the root names against its hash, so a root that named a
            // shard this copy does not hold would refuse to open at all.
            // `tests/index/shards.mjs` is what covers the shards.
            root.browse = [];
            await writeFile(join(out, "root.json"), JSON.stringify(root));
            for (const r of root.records) {
              const path = join(out, "models", r.repo + ".json");
              await mkdir(dirname(path), { recursive: true });
              await writeFile(path, Buffer.from(await (await fetch(base + "models/" + r.repo + ".json")).arrayBuffer()));
            }
          ' "$RUNNER_TEMP/index-copy"
          node tests/edge/complete.mjs https://hologram-technologies.github.io/hub/app/app.holo "$RUNNER_TEMP/index-copy"
      - name: A record says where its bytes come from, and the edge sends you there
        shell: bash
        run: node tests/edge/origin.mjs https://hologram-technologies.github.io/hub/app/app.holo "$RUNNER_TEMP/index-copy"
