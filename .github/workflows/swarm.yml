name: swarm

# The address snapshot: what the swarm's models should hash to, taken from
# Hugging Face while Hugging Face still answers.
#
# This is not here to index Pirate Face. Its catalog is 669k models and a
# seeder count that changes by the minute, and both can be asked for live;
# `runner/discover.mjs` does. What cannot be asked for later is the address,
# because a model is self-verifying only against a digest from somewhere other
# than the party serving the bytes. For a model Hugging Face has removed there
# is no second independent answer, so this is run nightly rather than on
# demand: the point is to have asked in time.
#
# It is deliberately not part of `pages`. The catalog is cursor-paginated and
# hard-capped at 30 rows a page, so a full sweep is about 22,300 requests, and
# putting that in front of every deploy would make every push to main wait for
# it. The result is left in the cache `pages` restores, the same way the
# witnessed manifests and the index already are.

on:
  schedule:
    # Nightly, after the hour, so it is not competing with everything else
    # that runs on it.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      pages:
        description: How many catalog pages to walk (blank for all)
        required: false

permissions:
  contents: read

concurrency:
  group: swarm
  cancel-in-progress: false

jobs:
  snapshot:
    name: write down what the swarm's models should hash to
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Keep the snapshot between runs
        # A release whose revision has not moved is not fetched again, so after
        # the first run almost nothing is asked of Hugging Face and the cost is
        # the catalog walk alone.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/swarm
          key: swarm-${{ hashFiles('tools/swarm-index.mjs') }}-${{ github.run_id }}
          restore-keys: swarm-${{ hashFiles('tools/swarm-index.mjs') }}-
      - name: Write down the catalog, sharded so a page can read a slice
        # Rows for browsing and searching, from Pirate Face's own listing and
        # nothing else - no Hugging Face calls. Sharded by the first two
        # characters of the model's name, because the whole catalog is about
        # 300 MB at 468 bytes a row and no page should load that: a prefix
        # shard is about 450 KB.
        #
        # First, because this step and the next share one timeout and they do
        # not fail the same way. The catalog walk is about 3.6 hours at the
        # 0.57 seconds a page measured on 2026-11-14, and makes no Hugging
        # Face calls; the address sweep walks the same catalog and then asks
        # Hugging Face about each release, so its first run is far longer. Run
        # second, the catalog would not be written at all on a run that ran
        # out of time, and a page with no catalog draws no swarm models. The
        # addresses are built to be accumulated over nightly runs - the point
        # is to have asked in time - so losing the tail of one sweep is how
        # that step already works.
        shell: bash
        run: |
          set -euo pipefail
          node tools/swarm-catalog.mjs "$RUNNER_TEMP/swarm/catalog" --all ${PAGES:+--pages "$PAGES"}
        env:
          PAGES: ${{ inputs.pages }}
      - name: Write down the addresses
        shell: bash
        run: |
          set -euo pipefail
          node tools/swarm-index.mjs "$RUNNER_TEMP/swarm" ${PAGES:+--pages "$PAGES"}
        env:
          PAGES: ${{ inputs.pages }}
      - name: Every shard is the bytes the root names
        shell: bash
        run: node tests/index/swarm-shards.mjs "$RUNNER_TEMP/swarm"
      - name: A row is in the shard the page will look in, and claims no more than a listing
        # The page reads one shard for a search and no other, so a row filed
        # by a different rule than the one the page resolves with is a row
        # nobody can find. Both sides import `web/swarmkey.mjs`; this holds
        # the built shards to it.
        shell: bash
        run: node tests/index/swarm-catalog.mjs "$RUNNER_TEMP/swarm/catalog"
      - name: Keep it where anyone can see what was written
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: swarm-index
          path: ${{ runner.temp }}/swarm
          retention-days: 7
