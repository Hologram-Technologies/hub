name: roll

# The roll is only worth keeping if it remembers what Hugging Face forgets and
# if a reader can tell whether a row of it is the hub's answer. So this runs
# the two rules that make it worth keeping: a model the listing no longer names
# is marked gone rather than dropped, and a shard the signed root does not name
# is refused rather than read.
#
# It walks one hour of the Hub, which is one call, and then a second time with
# a model that never existed planted inside that hour. If the tombstone rule
# were removed the planted model would simply vanish from the second build, and
# the test would say so.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tombstone:
    name: the roll remembers what the listing forgets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: A gone model keeps its line, and an unnamed shard is refused
        shell: bash
        run: node tests/roll/tombstone.mjs

      # The browse index is what lets the interface page through a roll it
      # could never hold, so what it must prove is that a page read through it
      # is the page the interface would have drawn from the whole catalogue.
      # An hour of the Hub is one call and enough rows to intersect.
      - name: A page read through the browse index is the page itself
        shell: bash
        run: |
          set -euo pipefail
          from=$(node -e 'console.log(new Date(Date.now() - 2 * 3600e3).toISOString())')
          to=$(node -e 'console.log(new Date(Date.now() - 300e3).toISOString())')
          node tools/roll.mjs "$RUNNER_TEMP/roll-browse" --from "$from" --to "$to"
          node tools/browse-index.mjs "$RUNNER_TEMP/roll-browse" "$RUNNER_TEMP/browse"
          node tests/browse/page.mjs "$RUNNER_TEMP/browse"
